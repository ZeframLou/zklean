[workspace]
members = ["crates/core", "crates/cli", "crates/verifier"]
exclude = ["crates/guest", "vendor/nanoda"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
# Nanoda's version; fixed-seed hashing, since RandomState would draw from the
# zkVM's insecure RNG.
rustc-hash = "1.1.0"

[profile.release]
overflow-checks = true
