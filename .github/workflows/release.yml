name: Package
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned SP1 toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/succinctlabs/sp1/v5.2.4/sp1up/sp1up -o /tmp/sp1up
          bash /tmp/sp1up --version v5.2.4
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install 1.91.1 --profile minimal
      - run: bun install --frozen-lockfile
      - run: bash scripts/prepare-sp1.sh
      - run: bash scripts/build-guest.sh
      - run: cargo build --release --locked -p zklean-native --features prover
      - run: bun run build:verifier
      - run: bash scripts/setup-exporter.sh
      - run: bun run check
      - run: bun scripts/check-proof-fixture.ts "$PWD/crates/guest/target/elf-compilation/riscv32im-succinct-zkvm-elf/release/zklean-guest"
      - run: bun scripts/export-examples.ts .tooling/lean4export/.lake/build/bin/lean4export
      - run: git diff --exit-code -- tests/fixtures/*.ndjson
      - run: bash scripts/package-release.sh dist
      - name: Test installation and bundled tools
        env:
          ZKLEAN_SKIP_LEAN: '1'
        run: |
          ZKLEAN_PREFIX="$RUNNER_TEMP/zklean" ZKLEAN_RELEASE_BASE="file://$PWD/dist" sh install.sh
          "$RUNNER_TEMP/zklean/bin/zklean" verify --certificate tests/fixtures/identity.certificate.json
          "$RUNNER_TEMP/zklean/bin/zklean" check --project examples/lean --module Identity --claims Demo.identity
      - uses: actions/upload-artifact@v4
        with:
          name: zklean-linux-x64
          path: |
            dist/zklean-linux-x64.tar.gz
            dist/zklean-linux-x64.tar.gz.sha256
