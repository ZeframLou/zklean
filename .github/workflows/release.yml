name: Package
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned SP1 toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/succinctlabs/sp1/v5.2.4/sp1up/sp1up -o /tmp/sp1up
          bash /tmp/sp1up --version v5.2.4
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install 1.91.1 --profile minimal
      - run: bun install --frozen-lockfile
      - run: bash scripts/prepare-sp1.sh
      - run: bash scripts/build-guest.sh
      - run: cargo build --release --locked -p zklean-native --features prover
      - run: bun run build:verifier
      - run: bash scripts/setup-exporter.sh
      - run: ZKLEAN_LAKE="$(command -v lake)" ZKLEAN_GUEST_ELF="$PWD/crates/guest/target/elf-compilation/riscv32im-succinct-zkvm-elf/release/zklean-guest" bun run check
      - run: cargo build --release --locked -p zklean-native --features prover,execute
      - run: bun scripts/check-proof-fixture.ts "$PWD/crates/guest/target/elf-compilation/riscv32im-succinct-zkvm-elf/release/zklean-guest"
      - run: bun scripts/export-examples.ts .tooling/lean4export/.lake/build/bin/lean4export
      - run: git diff --exit-code -- tests/fixtures/*.ndjson
      - run: bash scripts/package-release.sh dist
      - run: cp tests/fixtures/identity.certificate.json dist/identity.certificate.json
      - uses: actions/upload-artifact@v4
        with:
          name: zklean-linux-x64
          path: |
            dist/zklean-linux-x64.tar.gz
            dist/zklean-linux-x64.tar.gz.sha256
            dist/install.sh
            dist/README.md
            dist/SPEC.md
            dist/docs/
            dist/examples/
            dist/identity.certificate.json

  clean-install:
    needs: linux-x64
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - name: Install base operating-system tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl tar gzip zstd libgcc-s1
      - uses: actions/download-artifact@v4
        with:
          name: zklean-linux-x64
          path: release
      - name: Install archive and check real Lean source
        env:
          ZKLEAN_PREFIX: /tmp/zklean-install
          ELAN_HOME: /tmp/zklean-elan
        run: |
          ZKLEAN_RELEASE_BASE="file://$PWD/release" sh release/install.sh
          export PATH="/tmp/zklean-install/bin:/tmp/zklean-elan/bin:$PATH"
          zklean doctor
          zklean verify --certificate release/identity.certificate.json
          zklean pin --out /tmp/installed-verifier.json
          zklean init --project /tmp/installed-contract
          zklean check --project /tmp/installed-contract --module V1 --claims Inventory.reservation_safe --axioms propext
