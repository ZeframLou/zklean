name: Check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo fmt --check -p zklean-core -p zklean-native
      - run: cargo clippy --locked -p zklean-native -- -D warnings
      - run: bun run check

  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.91.1 --profile minimal
      - name: Install pinned SP1 toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/succinctlabs/sp1/v5.2.4/sp1up/sp1up -o /tmp/sp1up
          bash /tmp/sp1up --version v5.2.4
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-guest.sh
      - run: ZKLEAN_GUEST_ELF="$PWD/crates/guest/target/elf-compilation/riscv32im-succinct-zkvm-elf/release/zklean-guest" bun test tests/guest.e2e.test.ts
      - run: bash scripts/prepare-sp1.sh
      - run: cargo check --locked -p zklean-native --features sp1,execute
