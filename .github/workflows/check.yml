name: Check
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: bash scripts/prepare-sp1.sh
      - run: bun run build:verifier
      - run: cargo fmt --check -p zklean-core -p zklean-native -p zklean-verifier
      - run: cargo clippy --locked -p zklean-native -- -D warnings
      # Compile outside Bun's test-hook timeout on cold runners.
      - run: cargo build --release --locked -p zklean-native
      - run: bun run check
      - run: bun run compile

  formal-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bash scripts/setup-exporter.sh
      - run: bash scripts/prepare-sp1.sh
      - run: cargo build --release --locked -p zklean-native
      - run: bun scripts/export-examples.ts .tooling/lean4export/.lake/build/bin/lean4export
      - run: git diff --exit-code -- tests/fixtures/*.ndjson
      - run: bun scripts/pin-axioms.ts
      - run: git diff --exit-code -- src/axioms.json
      - run: ZKLEAN_LAKE="$(command -v lake)" bun test tests/tooling.e2e.test.ts

  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustup toolchain install 1.91.1 --profile minimal
      - name: Install pinned SP1 toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/succinctlabs/sp1/v5.2.4/sp1up/sp1up -o /tmp/sp1up
          bash /tmp/sp1up --version v5.2.4
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-guest.sh
      - run: bash scripts/prepare-sp1.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - run: cargo build --release --locked -p zklean-native --features prover,execute
      - run: ZKLEAN_GUEST_ELF="$PWD/crates/guest/target/elf-compilation/riscv32im-succinct-zkvm-elf/release/zklean-guest" bun test tests/guest.e2e.test.ts
      - run: cargo build --release --locked -p zklean-native --features prover,execute
      - run: bun scripts/check-proof-fixture.ts "$PWD/crates/guest/target/elf-compilation/riscv32im-succinct-zkvm-elf/release/zklean-guest"
      - run: cargo check --locked -p zklean-native --features execute
