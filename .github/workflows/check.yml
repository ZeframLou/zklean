name: Check
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - run: bun run build:verifier
      # CI's build is canonical; the committed binary must match it.
      - uses: actions/upload-artifact@v4
        with:
          name: zklean-verifier-wasm
          path: src/verifier.wasm
      - run: git diff --exit-code -- src/verifier.wasm
      - run: cargo fmt --check -p zklean-core -p zklean-native -p zklean-verifier
      - run: cargo clippy --locked -p zklean-core -p zklean-native -p zklean-verifier -- -D warnings
      # Compile outside Bun's test-hook timeout on cold runners.
      - run: cargo build --release --locked -p zklean-native
      - run: bun run check

  formal-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bash scripts/setup-exporter.sh
      - run: cargo build --release --locked -p zklean-native
      - run: bun scripts/export-examples.ts
      - run: git diff --exit-code -- tests/fixtures/*.ndjson
      - run: bun scripts/pin.ts
      - run: git diff --exit-code -- src/axioms.json crates/core/src/kernel.json
      - run: ZKLEAN_LAKE="$(command -v lake)" bun test tests/tooling.e2e.test.ts

  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install pinned SP1 toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/succinctlabs/sp1/v6.10.0/sp1up/sp1up -o /tmp/sp1up
          bash /tmp/sp1up --version v6.10.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-guest.sh
      # The canonical Linux build defines the pinned guest key; keep it for proving.
      - uses: actions/upload-artifact@v4
        with:
          name: zklean-guest-elf
          path: crates/guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/zklean-guest
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo build --release --locked -p zklean-native --features prover,execute
      # The committed verifier profile must be this guest's.
      - run: ZKLEAN_GUEST_ELF="$PWD/crates/guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/zklean-guest" bun src/cli.ts pin --out /tmp/guest.json
      - run: diff /tmp/guest.json src/guest.json
      - run: ZKLEAN_GUEST_ELF="$PWD/crates/guest/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/zklean-guest" bun test tests/guest.e2e.test.ts
