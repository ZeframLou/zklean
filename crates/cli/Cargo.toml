[package]
name = "zklean-native"
version = "0.1.0"
edition = "2021"

[features]
default = []
sp1 = ["dep:sp1-sdk", "dep:bincode", "dep:hex"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
zklean-core = { path = "../core" }
sp1-sdk = { version = "=5.2.4", optional = true }
bincode = { version = "1.3", optional = true }
hex = { version = "0.4", optional = true }
