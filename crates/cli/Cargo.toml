[package]
name = "zklean-native"
version = "0.1.0"
edition = "2021"

[features]
execute = ["dep:sp1-core-executor"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
zklean-core = { path = "../core" }
sp1-sdk = { version = "=5.2.4", default-features = false }
sp1-core-executor = { version = "=5.2.4", optional = true }
sp1-stark = "=5.2.4"
bincode = "1.3"
hex = "0.4"
