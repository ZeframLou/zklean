[package]
name = "zklean-native"
version = "0.1.0"
edition = "2021"

[features]
prover = [
    "dep:sp1-sdk",
    "sp1-sdk/native-gnark",
    "dep:base64",
    "dep:sha2",
    "dep:zklean-verifier",
    "dep:tracing-subscriber",
]
execute = ["dep:sp1-core-executor", "dep:sp1-stark", "dep:bincode"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zklean-core = { path = "../core" }
sp1-sdk = { version = "=5.2.4", default-features = false, optional = true }
zklean-verifier = { path = "../verifier", optional = true }
sp1-core-executor = { version = "=5.2.4", optional = true }
sp1-stark = { version = "=5.2.4", optional = true }
bincode = { version = "1.3", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
