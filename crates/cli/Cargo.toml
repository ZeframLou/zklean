[package]
name = "zklean-native"
version = "0.1.0"
edition = "2021"

[features]
prover = ["dep:sp1-sdk", "sp1-sdk/native-gnark"]
execute = ["dep:sp1-core-executor", "dep:sp1-stark"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
zklean-core = { path = "../core" }
nanoda_lib = { path = "../../vendor/nanoda" }
sp1-sdk = { version = "=5.2.4", default-features = false, optional = true }
zklean-verifier = { path = "../verifier" }
sp1-core-executor = { version = "=5.2.4", optional = true }
sp1-stark = { version = "=5.2.4", optional = true }
bincode = "1.3"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
