[package]
name = "zklean-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
sp1-zkvm = "=5.2.4"
zklean-core = { path = "../core" }

# SP1's SHA-256 precompile: identities hash every declaration in the export.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-4.0.0" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
